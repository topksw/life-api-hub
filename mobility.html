<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모빌리티 라이브</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font:15px/1.55 system-ui,'Malgun Gothic',sans-serif;background:#fffbf4;color:#422b35;margin:0;padding:16px}*{box-sizing:border-box}h1{font-size:24px;margin:0}p{margin:8px 0}.note{background:#fff1df;border:1px solid #eed9c7;border-radius:12px;padding:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}button,select,input{font:inherit;padding:8px;border:1px solid #e0c8c8;border-radius:8px;background:white;color:inherit}button{cursor:pointer}.active{background:#a72f55;color:white}#map{height:380px;border-radius:12px;background:#eee}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:8px}.card{background:white;border:1px solid #efdbda;border-radius:12px;padding:12px}.small{font-size:13px;color:#735761}.price{font-weight:700;color:#a72f55}.warn{color:#9a4212;font-weight:600}a{color:#a72f55}</style></head><body><h1>모빌리티 라이브</h1><p>주차 현황과 고속도로 주유소 가격을 한눈에</p><div class="note small">주차 현황은 일부 지역·일부 주차장만 제공되며 실제 상황과 다를 수 있어요. 주유소는 고속도로 휴게소 위주예요. 가격과 위치는 방문 전 확인해 주세요. 오래되거나 이름이 없는 자료와 오류가 확인된 일부 주유소 위치는 제외해요.</div><div class="bar"><button id="parking" class="active">주차장</button><button id="gas">고속도로 주유소</button><label>반경 <select id="radius"><option value="5">5km</option><option value="10" selected>10km</option><option value="30">30km</option><option value="100">100km</option><option value="0">전국</option></select></label><label id="fuelbox" hidden>유종 <select id="fuel"><option value="gasoline">휘발유</option><option value="diesel">경유</option><option value="lpg">LPG</option></select></label><input id="search" placeholder="이름·주소 검색" aria-label="이름 또는 주소 검색"><button id="reload">새로고침</button></div><p id="center" class="small"></p><div id="map" aria-label="모빌리티 지도"></div><p id="status" role="status">데이터를 불러오는 중이에요.</p><div id="results"></div><p class="small">출처: 디지털융합플랫폼 및 각 정보 제공기관 · 지도 © OpenStreetMap contributors. 지도 좌표는 오류가 있을 수 있어요. 기준 위치는 지도 클릭으로 바꿀 수 있어요.</p><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const $=s=>document.querySelector(s), api='https://n8n.aitestbed.kr/webhook/mobility/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let params=new URLSearchParams(location.search),lat=Number(params.get('lat')),lon=Number(params.get('lon'));if(!Number.isFinite(lat)||lat<33||lat>39||!Number.isFinite(lon)||lon<124||lon>132){lat=37.5665;lon=126.978}let label=params.get('name')||'서울시청',mode='parking',data={parking:null,gas:null}, errors={};
let map=L.map('map').setView([lat,lon],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let markers=L.layerGroup().addTo(map),center=L.marker([lat,lon]).addTo(map);map.on('click',e=>{lat=e.latlng.lat;lon=e.latlng.lng;label='지도에서 선택한 위치';center.setLatLng([lat,lon]);render()});
function km(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,z=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(z)))}
function time(s){if(!s)return null;let v=String(s).trim().replace(' ','T');if(!/[zZ]|[+-]\d\d:\d\d$/.test(v))v=v+'+09:00';let t=Date.parse(v);return Number.isFinite(t)?t:null}function fmt(t){return t?new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'확인 불가'}
async function load(force=false){const requestMode=mode;$('#status').textContent='데이터를 불러오는 중이에요.';try{let ac=new AbortController(),timer=setTimeout(()=>ac.abort(),25000);let r=await fetch(api+requestMode,{signal:ac.signal,cache:'no-store'});clearTimeout(timer);if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.ok||!Array.isArray(j.items))throw Error('응답 형식 오류');data[requestMode]=j;delete errors[requestMode]}catch(e){errors[requestMode]='불러오지 못했어요. 잠시 후 다시 시도해 주세요.'}render()}
function render(){let kind=mode,fuel=$('#fuel').value,query=$('#search').value.trim().toLowerCase(),rad=Number($('#radius').value);$('#center').textContent='기준 위치: '+label+' ('+lat.toFixed(3)+', '+lon.toFixed(3)+')';$('#fuelbox').hidden=kind!=='gas';$('#parking').classList.toggle('active',kind==='parking');$('#gas').classList.toggle('active',kind==='gas');markers.clearLayers();$('#results').innerHTML='';if(errors[kind]){$('#status').textContent=errors[kind];return}if(!data[kind]){load();return}let all=data[kind].items,now=Date.now(), valid=all.filter(x=>{let la=Number(x.lat),lo=Number(x.lng);if(!x.lat||!x.lng||!Number.isFinite(la)||!Number.isFinite(lo)||la<33||la>39||lo<124||lo>132)return false;if(kind==='gas'&&String(x.name||'').includes('이서(순천)'))return false;if(kind==='gas'&&(!String(x.name||'').trim()||!time(x.updated_at)||now-time(x.updated_at)>86400000||now-time(x.updated_at)<-300000))return false;return true}).map(x=>({...x,dist:km(lat,lon,+x.lat,+x.lng)})).filter(x=>(!rad||x.dist<=rad)&&(!query||((x.name||'')+' '+(x.address||'')+' '+(x.route||'')).toLowerCase().includes(query))).sort((a,b)=>a.dist-b.dist);let shown=valid.slice(0,100);$('#status').textContent=`${valid.length}곳 검색됨${valid.length>100?' · 가까운 100곳 표시':''} · 위치 없는 자료 제외${kind==='gas'?' · 이름 없거나 수집 24시간 지난 자료 제외':''}`;for(let x of shown){let t=time(kind==='parking'?x.status_time:x.updated_at),stale=!t||now-t>3600000||now-t< -300000;let detail=kind==='parking'?`<b class="price">${Number.isFinite(+x.available)&&x.available!==null&&+x.available>=0&&(+x.total<=0||+x.available<=+x.total)?esc(x.available)+'면':'잔여면 정보 오류·확인 필요'}</b> / 전체 ${x.total!=null?esc(x.total)+'면':'미확인'}<br><span class="${stale?'warn':'small'}">제공 시각: ${esc(fmt(t))}${stale?' · 오래되었거나 확인 필요':''}</span>`:`<b class="price">${x[fuel]!=null&&+x[fuel]>0?Number(x[fuel]).toLocaleString()+'원/L':'가격 정보 없음'}</b><br><span class="small">수집 시각: ${esc(fmt(t))} · 현장 가격 확인</span>`;let html=`<strong>${esc(x.name||'이름 없음')}</strong><br><span class="small">${esc(x.address||x.route||'주소 미제공')} · ${x.dist.toFixed(1)}km</span><br>${detail}`;let card=document.createElement('article');card.className='card';card.innerHTML=html;let btn=document.createElement('button');btn.textContent='지도에서 보기';btn.onclick=()=>{map.setView([+x.lat,+x.lng],15);marker.openPopup();$('#map').scrollIntoView({behavior:'smooth',block:'center'})};card.append(document.createElement('br'),btn);$('#results').append(card);let marker=L.marker([+x.lat,+x.lng]).addTo(markers).bindPopup(html)} }
$('#parking').onclick=()=>{mode='parking';render()};$('#gas').onclick=()=>{mode='gas';render()};$('#radius').onchange=render;$('#fuel').onchange=render;$('#search').oninput=render;$('#reload').onclick=()=>load(true);render();
</script></body></html>
